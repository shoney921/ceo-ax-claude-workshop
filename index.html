<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>입고 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">IM</span>
        <span class="brand-text">운영 관리<b>입고 관리</b></span>
      </div>

      <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>

      <div class="sidebar-foot">
        <button class="btn-connect" type="button" id="btn-connect" disabled>연결 준비 중</button>
        <p class="sidebar-note" id="account-note"></p>
      </div>
    </aside>

    <main class="main">
      <div class="status" id="status">
        좌측 하단의 <b>Google 계정 연결</b>을 선택하면 시트 데이터를 불러옵니다.
      </div>

      <div id="views"></div>

      <p class="note">
        이 서비스는 <b>조회·추가·수정</b>만 지원합니다. 삭제가 필요하면 Google Sheets에서 직접 처리하고
        <b>파일 → 버전 기록</b>을 통해 변경 이력을 관리하세요.
      </p>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
